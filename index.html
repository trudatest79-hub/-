<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>急診藥局前往電療室｜院內導航</title>
<style>
:root{--blue:#1677ff;--blue2:#0b5ed7;--green:#118a52;--red:#e53935;--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#dce5f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;min-height:100dvh}
header{background:linear-gradient(135deg,#0b5ed7,#1687ff);color:#fff;padding:14px 18px;box-shadow:0 2px 12px #0002;z-index:20;position:sticky;top:0}
header h1{font-size:20px;margin:0 0 4px} header p{margin:0;font-size:13px;opacity:.94}
main{display:grid;grid-template-columns:370px 1fr;gap:14px;padding:14px;min-height:0;flex:1;width:100%}
.panel,.map-card{background:var(--card);border:1px solid #e4ebf3;border-radius:16px;box-shadow:0 6px 24px #20304a12}
.panel{padding:16px;overflow:auto}
.route-title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px;border-radius:12px;background:#f5f9ff;border:1px solid #dce9ff}
.place{text-align:center;font-weight:800;font-size:15px} .arrow{font-size:24px;color:var(--blue)}
.status{margin-top:12px;padding:13px;border:1px solid #dfeaff;border-radius:12px;background:#f8fbff}
.status b{display:block;font-size:17px;margin-bottom:5px} .status small{color:var(--muted);line-height:1.55}
/* 照片區：沒有照片時保留預覽框；載入照片後依照片原始比例自動調整高度 */
.photo{margin-top:12px;border:2px dashed #b8c8dc;border-radius:14px;min-height:180px;background:#f7f9fc;display:grid;place-items:center;overflow:hidden;position:relative}
.photo.has-image{display:block;min-height:0}
.photo img{width:100%;height:auto;max-height:none;object-fit:contain;background:#fff;display:none;vertical-align:top}
.photo.has-image img{display:block}
.photo-expand{position:absolute;right:10px;bottom:10px;z-index:2;background:#111c;color:#fff;border:1px solid #fff7;border-radius:999px;padding:9px 12px;font-size:14px;display:none}
.placeholder{text-align:center;color:#667085;padding:18px;line-height:1.6} .placeholder strong{display:block;color:#344054;font-size:17px}
.instruction{margin-top:12px;padding:14px;border-left:6px solid var(--blue);background:#edf5ff;border-radius:10px;font-size:18px;font-weight:800;line-height:1.5}
.progress{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:12px 0 4px} .progress>div{height:100%;background:var(--blue);transition:.3s}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{border:0;border-radius:11px;padding:12px 10px;font:inherit;font-weight:800;cursor:pointer;min-height:46px;-webkit-tap-highlight-color:transparent}
.primary{background:var(--blue);color:#fff} .secondary{background:#edf4ff;color:#0b5ed7} .ghost{background:#f0f2f5;color:#344054}
.full{grid-column:1/-1}
.steps{margin-top:16px} .step{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #dfe5ec}
.dot{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#eaf2ff;color:#0b5ed7;font-size:13px;font-weight:900}
.step.active .dot{background:var(--blue);color:#fff;box-shadow:0 0 0 5px #1677ff20} .step.done .dot{background:var(--green);color:#fff}
.step-text{font-size:14px;line-height:1.5}
.hint{margin-top:14px;padding:10px;border-radius:10px;background:#fff8e7;border:1px solid #f3d38a;color:#795300;font-size:12px;line-height:1.55}
.map-card{position:relative;min-width:0;overflow:hidden}
.toolbar{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:6px}
.toolbar button{width:42px;height:42px;padding:0;background:#fff;color:#344054;border:1px solid #d8e0eb;box-shadow:0 3px 12px #0002;font-size:20px}
.map-wrap{position:absolute;inset:0;overflow:hidden;background:#eef2f7;touch-action:none}
.stage{position:absolute;left:0;top:0;width:1536px;height:1243px;transform-origin:0 0;will-change:transform}
.stage>img{position:absolute;inset:0;width:1536px;height:1243px;user-select:none;-webkit-user-drag:none}
.stage svg{position:absolute;inset:0;width:1536px;height:1243px;overflow:visible}
.route-shadow{fill:none;stroke:white;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;opacity:.96}
.route{fill:none;stroke:var(--blue);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24 13;animation:flow 1.1s linear infinite}
.route-done{fill:none;stroke:#22a06b;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
@keyframes flow{to{stroke-dashoffset:-37}}
.node circle{stroke:#fff;stroke-width:5;filter:drop-shadow(0 3px 5px #0005)}
.node text{font-size:21px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
.start circle{fill:#1677ff} .end circle{fill:#e53935} .turn circle{fill:#e53935} .current circle{fill:#1677ff;animation:pulse 1.5s infinite}
.turn text{fill:#fff;stroke:none;font-size:16px;font-weight:900;text-anchor:middle;dominant-baseline:central}
.star-mark{font-size:46px;font-weight:900;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;filter:drop-shadow(0 3px 5px #0006)}
.start-star{fill:#16a34a}.end-star{fill:#111827}.place-label{font-size:23px;font-weight:900;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}
@keyframes pulse{0%,100%{r:14}50%{r:21}}
.legend{position:absolute;left:12px;bottom:12px;z-index:5;background:#fffd;border:1px solid #dfe5ee;border-radius:10px;padding:9px 11px;font-size:12px;backdrop-filter:blur(4px)}
.photo-modal{position:fixed;inset:0;background:#000e;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.photo-modal.open{display:flex}
.photo-modal img{max-width:100%;max-height:88dvh;object-fit:contain;border-radius:12px}
.photo-modal button{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top));width:48px;height:48px;padding:0;border-radius:50%;background:#fff;color:#111;font-size:26px;z-index:101}
@media(max-width:850px){
  html{scroll-behavior:smooth}
  body{display:block;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  header{padding:10px 14px calc(10px + env(safe-area-inset-top));position:sticky;top:0}
  header h1{font-size:18px;margin:0} header p{font-size:12px}
  main{display:flex;flex-direction:column;padding:8px;gap:8px;min-height:auto}
  .map-card{order:1;height:38dvh;min-height:300px;border-radius:14px}
  .panel{order:2;padding:12px;overflow:visible;border-radius:14px}
  .route-title{padding:10px}.place{font-size:14px}.arrow{font-size:20px}
  .status{margin-top:10px;padding:11px}.status b{font-size:18px}.status small{font-size:13px}
  .photo{min-height:210px;margin-top:10px}
  .photo.has-image{min-height:0}
  .instruction{font-size:20px;line-height:1.55;padding:14px;margin-top:10px}
  .buttons{position:fixed;left:0;right:0;bottom:0;z-index:50;grid-template-columns:.85fr 1.4fr;gap:8px;margin:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#fffd;backdrop-filter:blur(12px);box-shadow:0 -5px 20px #0002;border-top:1px solid #dce5f0}
  .buttons button{min-height:54px;font-size:16px;border-radius:14px}
  .buttons .full{display:none}
  .steps{margin-top:14px}.step{padding:10px 0}.step-text{font-size:15px}
  .hint{font-size:13px;margin-bottom:8px}
  .toolbar{right:8px;top:8px}.toolbar button{width:44px;height:44px}
  .legend{left:8px;bottom:8px;padding:7px 9px;font-size:11px}
}
@media(max-width:430px){
  .map-card{height:35dvh;min-height:270px}
  .photo{min-height:190px}
  .photo.has-image{min-height:0}
  .instruction{font-size:19px}
  .route-title{grid-template-columns:1fr auto 1fr}.place{font-size:13px}
}

.lang-bar{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.lang-select{width:100%;min-height:46px;border:1px solid #cfd9e6;border-radius:11px;background:#fff;padding:9px 12px;font:inherit;font-weight:800;color:#24324a}
.auto-voice{display:flex;align-items:center;gap:7px;min-height:46px;padding:8px 11px;border:1px solid #dce5f0;border-radius:11px;background:#f8fbff;font-size:13px;font-weight:800;white-space:nowrap}
.auto-voice input{width:20px;height:20px;accent-color:var(--blue)}
@media(max-width:430px){.lang-bar{grid-template-columns:1fr}.auto-voice{justify-content:center}}
</style>
</head>

const $=id=>document.getElementById(id);
const tr=()=>i18n[lang];
const stepText=i=>steps[i].text[lang]||steps[i].text['zh-TW'];

function renderSteps(){ $('steps').innerHTML=steps.map((s,i)=>{const [title,text]=stepText(i);return `<div class="step ${i===current?'active':i<current?'done':''}"><div class="dot">${i<current?'✓':i+1}</div><div class="step-text"><b>${title}</b><br>${text}</div></div>`}).join(''); }

function zoom(f,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){const ns=Math.max(.25,Math.min(3,scale*f));tx=cx-(cx-tx)*(ns/scale);ty=cy-(cy-ty)*(ns/scale);scale=ns;apply();}
